name: Bug report
description: 报告可以使用公开 demo 素材复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先移除客户素材、真人照片、密钥、聊天记录和本机绝对路径。安全问题不要公开提交。
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: 0.21.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Route
      options:
        - Windows Sprite (default)
        - Android experimental source
        - Live2D research source
        - Tooling / documentation
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: 使用公开 demo 素材给出最小步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy checklist
      options:
        - label: 我确认附件不含客户/私人素材、密钥、聊天记录或本机绝对路径。
          required: true
