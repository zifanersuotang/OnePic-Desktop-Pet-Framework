name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Framework and privacy boundary
        run: python scripts/check_framework.py
      - name: Documentation links
        run: python scripts/check_markdown_links.py
      - name: Tests
        run: python -m pytest -q
      - name: Source startup smoke test
        run: python main.py --smoke-test-ms 1500
      - name: Build source wheel
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse
